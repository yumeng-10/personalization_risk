[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personalization-risk"
version = "0.1.0"
description = "Data construction and LLM-as-judge evaluation pipeline for personalization risk research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CS568 Team" }]
dependencies = [
  "openai>=1.55.0",
  "boto3>=1.35.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.2",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
prisk = "personalization_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
